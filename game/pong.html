<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pong - MiniGame Hub</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="pong.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

</head>

<body class="game-page">

<header class="game-navbar">

    <a href="../index.html" class="back-button">
        ← Hub
    </a>

    <div class="game-title">
        <span>🏓</span>
        Pong
    </div>

    <button class="pause-button" id="pauseButton">
        Pause
    </button>

</header>


<main class="pong-container">

    <!-- SCORE -->

    <div class="scoreboard">

        <div class="score-player">

            <span class="score-label" id="leftPlayerLabel">
                YOU
            </span>

            <span id="playerScore">
                0
            </span>

        </div>

        <div class="score-divider">
            :
        </div>

        <div class="score-player">

            <span class="score-label" id="rightPlayerLabel">
                AI
            </span>

            <span id="aiScore">
                0
            </span>

        </div>

    </div>


    <!-- GAME -->

    <div class="pong-wrapper">

        <canvas
            id="pongCanvas"
            width="1200"
            height="650"
        ></canvas>


        <!-- START / PAUSE OVERLAY -->

        <div class="game-overlay" id="gameOverlay">

            <div class="overlay-content">

                <span class="overlay-icon">
                    🏓
                </span>

                <h1 id="overlayTitle">
                    Pong
                </h1>

                <p id="overlayText">
                    Choose how you want to play.
                </p>


                <!-- MODE SELECTION -->

                <div class="menu-section" id="modeSelection">

                    <button
                        class="menu-button"
                        id="onePlayerButton"
                    >
                        <strong>1 Player</strong>
                        <span>Play against AI</span>
                    </button>

                    <button
                        class="menu-button"
                        id="twoPlayerButton"
                    >
                        <strong>2 Players</strong>
                        <span>Play against a friend</span>
                    </button>

                </div>


                <!-- DIFFICULTY -->

                <div
                    class="menu-section hidden"
                    id="difficultySelection"
                >

                    <div class="difficulty-grid">

                        <button class="difficulty-button" data-difficulty="noob">
                            <strong>🥔 Noob</strong>
                            <span>Very easy</span>
                        </button>

                        <button class="difficulty-button" data-difficulty="easy">
                            <strong>🟢 Easy</strong>
                            <span>Casual</span>
                        </button>

                        <button class="difficulty-button" data-difficulty="medium">
                            <strong>🟡 Medium</strong>
                            <span>A challenge</span>
                        </button>

                        <button class="difficulty-button" data-difficulty="hard">
                            <strong>🔴 Hard</strong>
                            <span>Very tough</span>
                        </button>

                        <button class="difficulty-button impossible" data-difficulty="impossible">
                            <strong>☠️ Impossible</strong>
                            <span>Never misses</span>
                        </button>

                    </div>

                    <button
                        class="back-menu-button"
                        id="backToModes"
                    >
                        ← Back
                    </button>

                </div>


                <!-- PLAY AGAIN / RESUME -->

                <button
                    class="game-button hidden"
                    id="startButton"
                >
                    Start Game
                </button>

            </div>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <div id="leftControls">
            <strong>W / S</strong>
            <span>Move</span>
        </div>

        <div>
            <strong>SPACE</strong>
            <span>Pause</span>
        </div>

        <div id="rightControls" class="hidden-control">
            <strong>↑ / ↓</strong>
            <span>Move</span>
        </div>

    </div>


    <!-- MOBILE -->

    <div class="mobile-controls">

        <button id="upButton">
            ▲
        </button>

        <button id="downButton">
            ▼
        </button>

    </div>

</main>


<script src="pong.js"></script>

</body>

</html>
