<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pong | Minigame Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="pong.css">
</head>

<body>

    <main class="pong-page">

        <header class="game-header">
            <a href="../index.html" class="back-button">
                ← Minigame Hub
            </a>

            <div class="scoreboard">
                <div class="score player-score">
                    <span id="playerScore">0</span>
                </div>

                <div class="score-divider">:</div>

                <div class="score opponent-score">
                    <span id="opponentScore">0</span>
                </div>
            </div>

            <button id="pauseButton" class="pause-button">
                Pause
            </button>
        </header>


        <section class="game-container">

            <canvas id="pongCanvas" width="1200" height="650"></canvas>

            <div id="countdown" class="countdown hidden">
                3
            </div>


            <!-- START / MODE OVERLAY -->
            <div id="overlay" class="overlay">

                <div class="overlay-card">

                    <h1 id="overlayTitle">Pong</h1>

                    <p id="overlayText">
                        Choose how you want to play.
                    </p>


                    <!-- MODE SELECTION -->
                    <div id="modeSelection" class="selection-section">

                        <div class="selection-grid mode-grid">

                            <button class="selection-button" data-mode="1">
                                <strong>1 Player</strong>
                                <span>Play against AI</span>
                            </button>

                            <button class="selection-button" data-mode="2">
                                <strong>2 Players</strong>
                                <span>Play with a friend</span>
                            </button>

                        </div>

                    </div>


                    <!-- DIFFICULTY -->
                    <div id="difficultySelection" class="selection-section hidden">

                        <h2>Choose AI Difficulty</h2>

                        <div class="selection-grid difficulty-grid">

                            <button class="selection-button" data-difficulty="noob">
                                <strong>Noob</strong>
                                <span>Basically free</span>
                            </button>

                            <button class="selection-button" data-difficulty="easy">
                                <strong>Easy</strong>
                                <span>A little challenge</span>
                            </button>

                            <button class="selection-button" data-difficulty="medium">
                                <strong>Medium</strong>
                                <span>Getting serious</span>
                            </button>

                            <button class="selection-button" data-difficulty="hard">
                                <strong>Hard</strong>
                                <span>Good luck</span>
                            </button>

                            <button class="selection-button impossible-button" data-difficulty="impossible">
                                <strong>Impossible</strong>
                                <span>AI never misses</span>
                            </button>

                        </div>

                    </div>


                    <!-- PLAYER 1 COLOR -->
                    <div id="playerColorSelection" class="selection-section hidden">

                        <h2 id="playerColorTitle">
                            Choose Your Color
                        </h2>

                        <div id="colorGrid" class="color-grid"></div>

                        <button id="confirmPlayerColor" class="confirm-button">
                            Continue
                        </button>

                    </div>


                    <!-- PLAYER 2 COLOR -->
                    <div id="player2ColorSelection" class="selection-section hidden">

                        <h2>
                            Player 2 — Choose Your Color
                        </h2>

                        <div id="player2ColorGrid" class="color-grid"></div>

                        <button id="startMatchButton" class="confirm-button">
                            Start Match
                        </button>

                    </div>


                    <!-- END SCREEN -->
                    <button id="startButton" class="game-button hidden">
                        Play Again
                    </button>

                </div>

            </div>

        </section>


        <div class="controls-info">

            <div>
                <span class="key">W</span>
                <span class="key">S</span>
                Move
            </div>

            <div>
                <span class="key">↑</span>
                <span class="key">↓</span>
                Player 2
            </div>

            <div>
                <span class="key">SPACE</span>
                Pause
            </div>

        </div>

    </main>

    <script src="pong.js"></script>

</body>
</html>
